<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C77">
<meta name="mobile-web-app-capable" content="yes">
<title>StudyFlow</title>
<style>
html{color-scheme:light dark}body{margin:0}
/* Layout: one narrow column built for a phone. Today on top, bottom tab bar, focus mode as a full-screen layer.
   Palette: cool paper + deep teal accent; each subject keeps its own hue. Type: IBM Plex Sans Arabic for text, Readex Pro for headings and the timer. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#E3E9ED; --fg:#12212B; --muted:#586976; --line:#D0D9DF;
  --accent:#0A7C77; --accent-ink:#FFFFFF; --accent-soft:#D2EDEA;
  --good:#1D8A4C; --good-soft:#D6EEDF; --warn:#A8560B; --warn-soft:#F7E4D0;
  --c-ar:#B0711A; --c-bio:#2B8A56; --c-phy:#2D68D6; --c-chem:#8648CC; --c-en:#CC416B;
  --ff-body:system-ui,-apple-system,'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic',Roboto,Tahoma,Arial,sans-serif;
  --ff-display:system-ui,-apple-system,'Segoe UI','Noto Sans Arabic','Noto Kufi Arabic',Roboto,Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C; --surface:#16222B; --surface2:#1F2F3A; --fg:#E6EEF2; --muted:#94A6B2; --line:#2A3C48;
    --accent:#3FC1B8; --accent-ink:#06231F; --accent-soft:#123B3A;
    --good:#58C98A; --good-soft:#143826; --warn:#F0A04A; --warn-soft:#40290F;
    --c-ar:#E2AB45; --c-bio:#58C487; --c-phy:#76A1F7; --c-chem:#B88CEC; --c-en:#F07FA1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16222B; --surface2:#1F2F3A; --fg:#E6EEF2; --muted:#94A6B2; --line:#2A3C48;
  --accent:#3FC1B8; --accent-ink:#06231F; --accent-soft:#123B3A;
  --good:#58C98A; --good-soft:#143826; --warn:#F0A04A; --warn-soft:#40290F;
  --c-ar:#E2AB45; --c-bio:#58C487; --c-phy:#76A1F7; --c-chem:#B88CEC; --c-en:#F07FA1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,p{margin:0}
#app{max-width:560px;margin:0 auto;padding-block:22px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.top h1{font:600 30px/1.2 var(--ff-display)}
.eyebrow{font-size:13px;color:var(--muted)}
.date-l{font-size:14px;color:var(--muted);text-align:end}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.big{font:600 24px/1.3 var(--ff-display)}
.count{font:500 22px var(--ff-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stat{margin-top:10px;font-size:14px;color:var(--muted)}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:600 18px var(--ff-display);margin-top:14px}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.cta.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);margin-top:10px}
.cta.danger{color:var(--warn);border-color:var(--warn)}
.sec-h{margin:26px 0 10px;font:600 15px var(--ff-display);color:var(--muted)}

.live{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.live b{font-variant-numeric:tabular-nums}
.live .go{padding:8px 14px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}

.task{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.task+.task{margin-top:10px}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;margin-top:2px}
.task.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-body{min-width:0}
.t-title{font-weight:600;overflow-wrap:anywhere}
.name-in{width:100%;border:0;border-bottom:2px dashed var(--line);background:transparent;padding:2px 0;font-weight:600;border-radius:0}
.name-in:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc)}
.tag{padding:1px 9px;border-radius:99px;background:var(--surface2);font-size:12px;color:var(--fg)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:start}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;font-size:13px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}

.subj{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.subj+.subj{margin-top:12px}
.subj-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start}
.subj-h .nm{display:flex;align-items:center;gap:10px;font:600 17px var(--ff-display)}
.subj-h .nm .dot{width:14px;height:14px}
.subj-h .ct{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.subj .bar{margin-top:10px}
.subj .bar>i{background:var(--sc)}
.note{margin-top:10px;font-size:13px;color:var(--muted);background:var(--surface2);padding:8px 12px;border-radius:10px}
.ls{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ls:first-of-type{margin-top:10px}
.ls .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.ls-st{min-width:64px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;text-align:center}
.ls-st.backlog{background:var(--warn-soft);color:var(--warn)}
.ls-st.done{background:var(--good-soft);color:var(--good)}
.ls-del{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.ls-del.arm{color:var(--warn);width:auto;padding:0 10px;font-size:13px;font-weight:600}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.add button{padding:0 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;min-width:46px}
.chev{transition:transform .2s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}

.wk{display:grid;gap:10px}
.wk-r{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wk-r.now{border:2px solid var(--accent);background:var(--accent-soft)}
.wk-d{font:600 16px var(--ff-display)}
.wk-c{font-weight:600;overflow-wrap:anywhere}
.wk-p{font-size:13px;color:var(--muted)}
.rules{margin:0;padding-inline-start:20px;color:var(--muted);font-size:14px;display:grid;gap:6px}
.fine{margin-top:12px;font-size:13px;color:var(--muted)}

.focus{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.f-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px}
.f-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-head h2{font:600 20px var(--ff-display)}
.x{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.lead{color:var(--muted)}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.pick+.pick{margin-top:10px}
.pick[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.pick[aria-checked="true"] .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--accent-soft)}
.pick .pt{min-width:0;flex:1;font-weight:600;overflow-wrap:anywhere}
.pick .pm{font-size:13px;color:var(--muted);font-weight:400;display:flex;gap:8px;align-items:center;margin-top:2px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pre{padding:10px 6px;border:2px solid var(--line);border-radius:12px;text-align:center;background:var(--surface)}
.pre[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pre b{display:block;font:600 17px var(--ff-display);font-variant-numeric:tabular-nums}
.pre span{font-size:13px;color:var(--muted)}
.f-task{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.f-task strong{font:600 20px/1.4 var(--ff-display);overflow-wrap:anywhere}
.ring{position:relative;width:min(76vw,290px);aspect-ratio:1;max-width:100%;margin:6px auto}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .prg{fill:none;stroke:var(--ph);stroke-width:12;stroke-linecap:round}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c .ph{font-size:15px;color:var(--muted);font-weight:500}
.ring-c .tm{font:500 56px/1.1 var(--ff-display);font-variant-numeric:tabular-nums}
.cyc{display:flex;justify-content:center;gap:8px}
.cyc i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.cyc i.on{background:var(--accent);border-color:var(--accent)}
.cyc i.cur{border-color:var(--accent)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:4px}
.round{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pill{padding:0 20px;min-height:48px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.textbtn{align-self:center;padding:10px 14px;color:var(--muted);font-size:14px}
.textbtn.arm{color:var(--warn);font-weight:600}
.ask h2{font:600 28px/1.3 var(--ff-display)}
.ask{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:13px}
.hint{font-size:13px;color:var(--muted);text-align:center}
.okmark{width:84px;height:84px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:10px auto 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>window.addEventListener("error",function(e){var d=document.createElement("pre");d.style.cssText="white-space:pre-wrap;padding:16px;margin:0;background:#fff3cd;color:#000;direction:ltr";d.textContent="Error: "+e.message+" (line "+e.lineno+")";document.body.prepend(d);});</script>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <p class="eyebrow" id="dayName"></p>
      <h1>StudyFlow</h1>
    </div>
    <p class="date-l" id="dateLine"></p>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="التنقل">
    <div class="tabs-in">
      <button class="tab" data-act="tab" data-id="today" id="tab-today"></button>
      <button class="tab" data-act="tab" data-id="backlog" id="tab-backlog"></button>
      <button class="tab" data-act="tab" data-id="week" id="tab-week"></button>
    </div>
  </nav>
  <div id="focus" class="focus" role="dialog" aria-modal="true" aria-label="جلسة تركيز" hidden></div>
</div>

<script>
(function(){
'use strict';
document.documentElement.lang='ar';
document.documentElement.dir='rtl';

var KEY='studyflow:v1';
var SUBJ={
  ar:{name:'اللغة العربية',short:'عربي',c:'--c-ar'},
  bio:{name:'الأحياء',short:'أحياء',c:'--c-bio'},
  phy:{name:'الفيزياء',short:'فيزياء',c:'--c-phy'},
  chem:{name:'الكيمياء',short:'كيمياء',c:'--c-chem'},
  en:{name:'اللغة الإنجليزية',short:'إنجليزي',c:'--c-en'}
};
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var WEEK={
  5:{cls:'عربي',big:[{t:'new',s:'ar'},{t:'backlog'}],small:true},
  6:{cls:'English Vocab Online',big:[{t:'new',s:'en',label:'Vocab'},{t:'backlog'}],small:true},
  0:{cls:'فيزياء',big:[{t:'new',s:'phy'},{t:'backlog'}],small:true},
  1:{cls:'يوم فارغ',big:[{t:'backlog'},{t:'backlog'}],small:true},
  2:{cls:'English Grammar + أحياء Online',big:[{t:'new',s:'en',label:'Grammar'},{t:'new',s:'bio'}],small:false},
  3:{cls:'كيمياء',big:[{t:'new',s:'chem'},{t:'backlog'}],small:true},
  4:{cls:'يوم فارغ',big:[{t:'backlog'},{t:'backlog'}],small:true}
};
var ORDER=[5,6,0,1,2,3,4];
var PRESETS=[
  {f:15,b:3,l:10,n:'خفيفة'},
  {f:25,b:5,l:15,n:'بومودورو'},
  {f:50,b:10,l:20,n:'عميقة'}
];
var KIND={'new':'درس جديد',backlog:'تراكم',review:'مراجعة'};
var C=2*Math.PI*96;

function $(s,el){return (el||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12);}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000);}

var I={
  play:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>',
  playL:'<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  checkL:'<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  tToday:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  tBack:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4-8 4zM4 12.5l8 4 8-4M4 17l8 4 8-4"/></svg>',
  tWeek:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'
};
$('#tab-today').innerHTML=I.tToday+'<span>اليوم</span>';
$('#tab-backlog').innerHTML=I.tBack+'<span>التراكم</span>';
$('#tab-week').innerHTML=I.tWeek+'<span>الأسبوع</span>';

/* ---------- data ---------- */
function seed(){
  function a(list){return list.map(function(x){return {id:uid(),title:x[0],status:x[1],ph:!!x[2]};});}
  var B='backlog',D='done';
  return {
    v:1,
    lessons:{
      ar:a([['الجملة الاسمية',B],['كان وأخواتها',B],['لم وأخواتها',B],['إن وأخواتها',B],['لا النافية للجنس',B],['الضمائر',B],['كم الاستفهامية والخبرية',B],['حروف الجر الزائدة',B],['المنادى',B],['أنواع من',B],['الممنوع من الصرف',B],['الأدب الكلاسيكي',D],['الأدب الوجداني',B]]),
      bio:a([['الباب الأول: الدعامة',D],['الباب الأول: الحركة',D],['الباب الثاني: التنسيق الهرموني',B],['تابع الغدد',B],['الباب الثالث: طرق التكاثر',D],['تابع طرق التكاثر',D]]),
      phy:a([['شدة التيار والمقاومات',B],['توصيل المقاومات',B],['قانون أوم',B],['قانون كيرشوف',B],['الفيض المغناطيسي في سلك مستقيم',D],['الملف الدائري واللولبي',D],['عزم الازدواج',D]]),
      chem:a([['الباب الأول (كل الدروس)',B,1],['الباب الثاني (كل الدروس)',B,1]]),
      en:a([['Unit 1',B,1],['Unit 2',B,1],['Unit 3',B,1],['Unit 4',B,1]])
    },

}

var TK='',DOW=0;
var ui={tab:'today',open:{},focusOpen:false,pick:{taskId:null,preset:1,manual:false},arm:null};

function refreshToday(){

/* ---------- plan algorithm ---------- */
function defaultLessonName(t){
  var d=t.date?DAYS[parseKey(t.date).getDay()]:'';
  return (t.label?t.label+' - ':'')+'درس '+SUBJ[t.subject].short+(d?' يوم '+d:'');
}
function taskName(t){
  if(t.title&&t.title.trim())return t.title.trim();
  if(t.kind==='new')return 'درس '+(t.label?t.label+' ':'')+SUBJ[t.subject].short+' الجديد';
  return '';
}
function newTask(b){
  return {id:uid(),kind:'new',size:'big',subject:b.s,label:b.label||'',title:'',status:'todo',solved:false,pomos:0,minutes:0,date:TK};
}
function pickBacklog(used,chosen){
  var cands=[];
  Object.keys(SUBJ).forEach(function(s){
    var l=S.lessons[s].find(function(x){return x.status==='backlog'&&!chosen.has(x.id);});
    if(!l)return;
    var count=S.lessons[s].filter(function(x){return x.status==='backlog';}).length;
    var since=S.lastPicked[s]?Math.min(7,Math.max(0,daysBetween(S.lastPicked[s],TK))):7;
    cands.push({s:s,l:l,score:count+since*2,used:used.has(s)});
  });
  if(!cands.length)return null;
  var pool=cands.filter(function(c){return !c.used;});
  return (pool.length?pool:cands).sort(function(a,b){return b.score-a.score;})[0];
}
function pickReview(chosen){
  var all=[];
  Object.keys(SUBJ).forEach(function(s){S.lessons[s].forEach(function(l){if(l.status==='done'&&!chosen.has(l.id))all.push({s:s,l:l});});});
  if(!all.length)return null;
  all.sort(function(a,b){return (a.l.reviewedAt||0)-(b.l.reviewedAt||0);});
  return all[0];
}
function lessonTask(kind,size,c){
  return {id:uid(),kind:kind,size:size,subject:c.s,lessonId:c.l.id,title:c.l.title,status:'todo',solved:false,pomos:0,minutes:0,date:TK};
}
function rollover(){
  Object.keys(S.plans).forEach(function(k){
    if(k>=TK)return;
    S.plans[k].forEach(function(t){
      if(t.kind==='new'&&t.status!=='done'&&!t.rolled){
        t.rolled=true;
        S.lessons[t.subject].push({id:uid(),title:(t.title&&t.title.trim())||defaultLessonName(t),status:'backlog',ph:false});
      }
    });
    if(daysBetween(k,TK)>30)delete S.plans[k];
  });
}
function ensurePlan(){
  if(S.plans[TK])return;
  rollover();
  var cfg=WEEK[DOW],used=new Set(),chosen=new Set(),tasks=[];
  cfg.big.forEach(function(b){if(b.t==='new')used.add(b.s);});
  cfg.big.forEach(function(b){
    if(b.t==='new'){tasks.push(newTask(b));return;}
    var c=pickBacklog(used,chosen);
    if(c){used.add(c.s);chosen.add(c.l.id);S.lastPicked[c.s]=TK;tasks.push(lessonTask('backlog','big',c));}
    else{var r=pickReview(chosen);if(r){chosen.add(r.l.id);tasks.push(lessonTask('review','big',r));}}
  });
  if(cfg.small){
    var r2=pickReview(chosen);
    if(r2){chosen.add(r2.l.id);tasks.push(lessonTask('review','small',r2));}
  }
  S.plans[TK]=tasks;
  save();
}
function findTask(id){return (S.plans[TK]||[]).find(function(t){return t.id===id;});}
function getLesson(t){return S.lessons[t.subject].find(function(x){return x.id===t.lessonId;});}
function daily(){return S.daily[TK]||(S.daily[TK]={pomos:0,minutes:0});}

function setTaskDone(t,done){
  var l;
  if(done){
    t.status='done';
    if(t.kind==='new'){
      if(!t.lessonId){l={id:uid(),title:(t.title&&t.title.trim())||defaultLessonName(t),status:'done',ph:false};S.lessons[t.subject].push(l);t.lessonId=l.id;}
    }else if(t.kind==='backlog'){l=getLesson(t);if(l)l.status='done';}
    else{l=getLesson(t);if(l)l.reviewedAt=Date.now();}
  }else{
    t.status='todo';t.solved=false;
    if(t.kind==='new'&&t.lessonId){
      S.lessons[t.subject]=S.lessons[t.subject].filter(function(x){return x.id!==t.lessonId;});
      delete t.lessonId;
    }else if(t.kind==='backlog'){l=getLesson(t);if(l)l.status='backlog';}
  }
}

/* ---------- sound / wake lock ---------- */
var ac=null,wl=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function chime(){
  try{
    unlockAudio();if(!ac)return;
    [660,880,1100].forEach(function(f,i){
      var t0=ac.currentTime+i*0.25,o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+0.25);
    });
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }catch(e){}
}
function takeWake(){try{if('wakeLock' in navigator&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}}catch(e){}}
function dropWake(){try{if(wl){wl.release();wl=null;}}catch(e){}}

function viewBacklog(){

/* ---------- focus mode ---------- */
function fHead(title){return '<div class="f-head"><h2>'+title+'</h2><button class="x" data-act="fclose" aria-label="إغلاق">'+I.close+'</button></div>';}
function fPick(){
  var tasks=(S.plans[TK]||[]).filter(function(t){return t.status!=='done';});
  if(!tasks.some(function(t){return t.id===ui.pick.taskId;}))ui.pick.taskId=tasks[0]?tasks[0].id:null;
  var sel=tasks.find(function(t){return t.id===ui.pick.taskId;});
  if(!ui.pick.manual)ui.pick.preset=(sel&&sel.size==='small')?0:1;
  var h=fHead('جلسة تركيز');
  if(!tasks.length)return h+'<div class="empty">خلصت كل مهام اليوم. بالتوفيق، ارتاح.</div><button class="cta" data-act="fclose">رجوع</button>';
  h+='<p class="lead">اختر المهمة التي ستشتغل عليها الآن</p><div role="radiogroup" aria-label="مهام اليوم">';
  tasks.forEach(function(t){
    h+='<button class="pick" role="radio" aria-checked="'+(t.id===ui.pick.taskId)+'" data-act="fpick" data-id="'+t.id+'"><span class="rd"></span><span class="pt">'+esc(taskName(t))+'<span class="pm">'+chip(t.subject)+'<span>'+KIND[t.kind]+' · '+(t.size==='big'?'كبيرة':'صغيرة')+'</span></span></span></button>';
  });
  h+='</div><div class="presets" role="group" aria-label="مدة الجلسة">';
  PRESETS.forEach(function(p,i){h+='<button class="pre" data-act="fpre" data-id="'+i+'" aria-pressed="'+(ui.pick.preset===i)+'"><b>'+p.f+' / '+p.b+'</b><span>'+p.n+'</span></button>';});
  h+='</div><button class="cta" data-act="fstart">'+I.play+' ابدأ التركيز</button><p class="hint">الرقم الأول دقائق التركيز، والثاني دقائق الاستراحة.</p>';
  return h;
}
function fTaskHead(t){return '<div class="f-task">'+(t?chip(t.subject):'')+'<strong>'+esc(t?taskName(t):'')+'</strong></div>';}
function fRun(se){
  var t=findTask(se.taskId),isF=se.phase==='focus';
  var rem=se.paused?se.remaining:Math.max(0,se.endAt-Date.now());
  var p=1-rem/se.total;
  var label=se.paused?'متوقف مؤقتًا':(isF?'تركيز':(se.phase==='long'?'استراحة طويلة':'استراحة قصيرة'));
  var dots='';for(var i=0;i<4;i++)dots+='<i class="'+(i<se.cycle?'on':(isF&&i===se.cycle?'cur':''))+'"></i>';
  var h=fHead(isF?'وقت التركيز':'وقت الراحة')+fTaskHead(t)
    +'<div class="ring" style="--ph:var('+(isF?'--accent':'--good')+')"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="trk" cx="110" cy="110" r="96"/><circle class="prg" id="rg" cx="110" cy="110" r="96" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-p)).toFixed(2)+'"/></svg>'
    +'<div class="ring-c"><span class="ph" id="phl">'+label+'</span><span class="tm" id="tm" role="timer">'+fmt(rem)+'</span></div></div>'
    +'<div class="cyc" aria-label="جلسات الدورة">'+dots+'</div>'
    +'<div class="ctrls"><button class="round" data-act="fpause" aria-label="'+(se.paused?'استئناف':'إيقاف مؤقت')+'">'+(se.paused?I.playL:I.pause)+'</button>'
    +'<button class="pill" data-act="'+(isF?'fearly':'fskipbreak')+'">'+(isF?'خلصت المهمة':'تخطي الاستراحة')+'</button></div>';
  h+='<button class="textbtn'+(ui.arm==='cancel'?' arm':'')+'" data-act="fcancel">'+(ui.arm==='cancel'?'تأكيد إلغاء الجلسة':'إلغاء الجلسة')+'</button>';
  return h;
}
function fAsk(se){
  var t=findTask(se.taskId),P=PRESETS[se.preset];
  var h=fHead(se.early?'أنهيت الجلسة':'انتهى وقت التركيز')+'<div class="ask">'+fTaskHead(t)+'<h2 style="text-align:center">خلصت المهمة؟</h2>';
  if(t&&t.kind!=='review')h+='<label class="chk"><input type="checkbox" id="solvedChk"><span>حليت الأسئلة كمان<small>الإنجاز عندك يعني مذاكرة وحل.</small></span></label>';

function fFinished(se){
  var t=findTask(se.taskId);
  var rest=(S.plans[TK]||[]).some(function(x){return x.status!=='done';});
  var warn=(t&&t.kind!=='review'&&!t.solved)?'<p class="hint">علّمتها بدون حل. تقدر تعلّم «تم الحل» من القائمة بعدين.</p>':'';
  return fHead('تمام')+'<div class="ask"><div class="okmark">'+I.checkL+'</div><h2 style="text-align:center">المهمة اتعلّمت منجزة</h2>'+fTaskHead(t)+warn
    +(rest?'<button class="cta" data-act="fnext">مهمة تالية</button><button class="cta ghost" data-act="fexit">خروج</button>':'<p class="hint">خلصت كل مهام اليوم.</p><button class="cta" data-act="fexit">خروج</button>')+'</div>';
}
function renderFocus(){
  var el=$('#focus');
  if(!ui.focusOpen){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  var se=S.session,h;
  if(!se)h=fPick();
  else if(se.view==='run')h=fRun(se);
  else if(se.view==='ask')h=fAsk(se);
  else if(se.view==='breakdone')h=fBreakDone(se);
  else h=fFinished(se);

function render(){
  refreshToday();
  var now=new Date();
  $('#dayName').textContent=DAYS[now.getDay()];
  try{$('#dateLine').textContent=now.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long'});}catch(e){$('#dateLine').textContent=TK;}
  $('#view').innerHTML=ui.tab==='today'?viewToday():(ui.tab==='backlog'?viewBacklog():viewWeek());
  ['today','backlog','week'].forEach(function(k){var b=$('#tab-'+k);if(k===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}
function commit(){save();render();renderFocus();}

/* ---------- timer ---------- */
function startPhase(phase){
  var se=S.session,P=PRESETS[se.preset];
  var mins=phase==='focus'?P.f:(phase==='long'?P.l:P.b);
  se.phase=phase;se.total=mins*60000;se.endAt=Date.now()+se.total;se.paused=false;se.view='run';se.early=false;
  if(phase==='focus'){var t=findTask(se.taskId);if(t&&t.status==='todo')t.status='doing';}
  takeWake();
}
function phaseEnd(){
  var se=S.session;if(!se)return;
  if(se.phase==='focus'){
    var P=PRESETS[se.preset],t=findTask(se.taskId);
    if(t){t.pomos=(t.pomos||0)+1;t.minutes=(t.minutes||0)+P.f;}
    var d=daily();d.pomos++;d.minutes+=P.f;
    se.cycle=(se.cycle||0)+1;se.view='ask';se.early=false;
  }else se.view='breakdone';
  dropWake();chime();commit();
}
function tick(){
  var se=S.session;
  if(!se||se.view!=='run'||se.paused)return;
  var rem=se.endAt-Date.now();
  if(rem<=0){phaseEnd();return;}
  var tm=$('#tm');if(tm)tm.textContent=fmt(rem);
  var rg=$('#rg');if(rg)rg.style.strokeDashoffset=(C*(1-(1-rem/se.total))).toFixed(2);
  var mi=$('#mini');if(mi)mi.textContent=fmt(rem);
}
setInterval(tick,250);
document.addEventListener('visibilitychange',function(){if(!document.hidden){var k=TK;refreshToday();if(k!==TK)commit();tick();}});

/* ---------- actions ---------- */
function openFocus(id){
  ui.focusOpen=true;
  if(!S.session){ui.pick.taskId=id||null;ui.pick.manual=false;}
  renderFocus();
}
function act(a,id,s){
  var was=ui.arm;ui.arm=null;
  var se=S.session,t;
  switch(a){
    case 'tab':ui.tab=id;window.scrollTo(0,0);return commit();
    case 'toggle':t=findTask(id);if(t){setTaskDone(t,t.status!=='done');}return commit();
    case 'solved':t=findTask(id);if(t)t.solved=!t.solved;return commit();
    case 'start':return openFocus(id);
    case 'openfocus':return openFocus(null);
    case 'sopen':ui.open[s]=!ui.open[s];return commit();
    case 'lt':var l=S.lessons[s].find(function(x){return x.id===id;});if(l){l.status=l.status==='done'?'backlog':'done';}return commit();
    case 'ld':
      if(was!=='del:'+id){ui.arm='del:'+id;return commit();}
      S.lessons[s]=S.lessons[s].filter(function(x){return x.id!==id;});return commit();
    case 'reset':
      if(was!=='reset'){ui.arm='reset';return commit();}
      S=seed();TK='';ui.open={};refreshToday();return commit();
    case 'fclose':
      ui.focusOpen=false;
      if(se&&se.view==='finished')S.session=null;
      return commit();
    case 'fexit':S.session=null;ui.focusOpen=false;return commit();
    case 'fpick':ui.pick.taskId=id;return renderFocus();
    case 'fpre':ui.pick.preset=Number(id);ui.pick.manual=true;return renderFocus();
    case 'fstart':
      if(!ui.pick.taskId)return;
      unlockAudio();
      S.session={taskId:ui.pick.taskId,preset:ui.pick.preset,cycle:0,phase:'focus'};
      startPhase('focus');return commit();
    case 'fpause':
      if(!se)return;
      if(se.paused){se.endAt=Date.now()+se.remaining;se.paused=false;takeWake();}
      else{se.remaining=se.endAt-Date.now();se.paused=true;}
      return commit();
    case 'fearly':
      if(!se)return;
      var rem=se.paused?se.remaining:Math.max(0,se.endAt-Date.now());
      var el=Math.max(0,Math.round((se.total-rem)/60000));
      t=findTask(se.taskId);if(t)t.minutes=(t.minutes||0)+el;
      daily().minutes+=el;
      se.view='ask';se.early=true;se.paused=false;dropWake();return commit();
    case 'fskipbreak':if(!se)return;startPhase('focus');return commit();
    case 'fcancel':
      if(was!=='cancel'){ui.arm='cancel';return commit();}
      t=se&&findTask(se.taskId);if(t&&t.status==='doing')t.status='todo';
      S.session=null;dropWake();ui.pick.taskId=null;return commit();
    case 'fdone':
      if(!se)return;
      t=findTask(se.taskId);
      var chk=$('#solvedChk');
      if(t){setTaskDone(t,true);t.solved=t.kind==='review'?true:!!(chk&&chk.checked);}
      se.view='finished';return commit();
    case 'fmore':
      if(!se)return;
      if(se.early){startPhase('focus');return commit();}
      if(se.cycle>=4){se.cycle=0;startPhase('long');}else startPhase('short');
      return commit();
    case 'fnextsess':if(!se)return;startPhase('focus');return commit();
    case 'fnext':
      S.session=null;ui.pick.taskId=null;ui.pick.manual=false;return commit();
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  act(b.dataset.act,b.dataset.id,b.dataset.s);
});
document.addEventListener('input',function(e){
  var n=e.target&&e.target.dataset&&e.target.dataset.name;
  if(n){var t=findTask(n);if(t){t.title=e.target.value;save();}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form="add"]');if(!f)return;
  e.preventDefault();
  var v=f.querySelector('input').value.trim();if(!v)return;
  var s=f.dataset.s;
  S.lessons[s].push({id:uid(),title:v,status:'backlog',ph:false});
  commit();
  var again=document.getElementById('add-'+s);if(again)again.focus();
});

S=load();
refreshToday();
ui.focusOpen=!!S.session;
render();
renderFocus();
})();
</script>
</body>
